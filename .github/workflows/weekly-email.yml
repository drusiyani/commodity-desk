name: Weekly email

# Every Monday at 07:00 UK time, a detailed weekly review by email (email_report.py). GitHub's schedule is in UTC, so
# it runs at 06:00 and 07:00 UTC and only the run that falls at 07:00 in the UK sends (BST in summer, GMT in winter).
# The review is private: it is never posted anywhere public, saved in the repository or uploaded as an artifact, and
# the log only says whether it was sent. If sending fails, the run fails and GitHub alerts you.
on:
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Send it now, whatever the day and time"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read     # to list the week's failed workflow runs for the "problems" section

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt matplotlib
      - name: Build and send the weekly review
        run: python email_report.py
        env:
          ARGON_PASSWORD: ${{ secrets.ARGON_PASSWORD }}   # to read the private (encrypted) data
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ github.token }}
