name: Run strategy lab

on:
  schedule:
    - cron: "17 18 * * 0"   # every Sunday evening (UTC)
  workflow_dispatch:         # or run it by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-lab.txt
      - name: Claude invents and tests strategies
        run: python research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save results
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/strategies.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Strategy lab $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
