name: Run strategy lab

on:
  schedule:
    - cron: "17 18 * * 0"   # every Sunday evening (UTC)
  workflow_dispatch:         # or run it by hand
    inputs:
      recheck_only:
        description: "Only re-run the checks on the existing strategies (no new ideas, no Claude cost)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-lab.txt
      - name: Claude invents and tests strategies
        if: ${{ !inputs.recheck_only }}
        run: python research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARGON_PASSWORD: ${{ secrets.ARGON_PASSWORD }}   # to read which strategies were retired (lab.json, encrypted)
      # One more Claude call a week: Claude reviews the trades it closed and the calls checked this week
      # (journal), then updates its lessons. Both are private and saved encrypted in state/.
      - name: Claude reviews its week (trade journal and lessons)
        if: ${{ !inputs.recheck_only }}
        run: python learning.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARGON_PASSWORD: ${{ secrets.ARGON_PASSWORD }}
      - name: Re-check the existing strategies
        if: ${{ inputs.recheck_only }}
        run: python research.py --recheck
        env:
          ARGON_PASSWORD: ${{ secrets.ARGON_PASSWORD }}
      - name: Save results
        if: ${{ !cancelled() }}   # the lab's results are kept even if the journal step failed (the run still shows red)
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/strategies.json state
          if git ls-files site/data | grep -E '/(journal|lessons)\.json$'; then
            echo "Refusing to commit private data in plain text"; exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Strategy lab $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
