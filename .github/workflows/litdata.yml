name: Fetch LIT development data (temporary)
on:
  push:
    branches: [claude/commodity-trading-v2-z09y0m]
    paths: [tools/lit_fetch.py, .github/workflows/litdata.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/lit_fetch.py
      - name: Push the data to a scratch branch (never merged)
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan litdata
          git rm -rq --cached .
          git add lit_data.json
          git commit -qm "LIT development data"
          git push -f origin litdata:claude/commodity-trading-v2-z09y0m-litdata
