name: Run backtest

on:
  workflow_dispatch:   # run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trader        # never runs at the same time as the trader
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python backtest.py
      - name: Save results
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backtest $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
