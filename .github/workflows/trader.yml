name: Run trader

on:
  schedule:
    - cron: "7 * * * 1-5"   # every hour Mon-Fri (UTC); Claude itself is only asked every 4 hours
  workflow_dispatch:         # manual runs always ask Claude

permissions:
  contents: write
  pages: write
  id-token: write

env:
  KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a   # github.com/shiyu-coder/Kronos, pinned
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HOME: ${{ github.workspace }}/.hf-cache   # model weights live here so they can be cached

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                       # keeps the PyTorch download between runs
          cache-dependency-path: |
            requirements.txt
            requirements-kronos.txt

      - run: pip install -r requirements.txt

      # Kronos, the AI forecasting model. If any of this fails the run carries on without it,
      # and the website's "Kronos" status light shows the problem.
      - name: Install Kronos (CPU-only PyTorch and the Kronos code at a pinned commit)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-kronos.txt
          git init -q vendor/kronos
          git -C vendor/kronos fetch -q --depth 1 https://github.com/shiyu-coder/Kronos ${{ env.KRONOS_COMMIT }}
          git -C vendor/kronos checkout -q FETCH_HEAD

      - name: Restore the cached Kronos model weights
        id: weights
        uses: actions/cache/restore@v4
        with:
          path: .hf-cache
          key: kronos-mini-${{ env.KRONOS_COMMIT }}

      - name: Run engine
        run: python engine.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARGON_PASSWORD: ${{ secrets.ARGON_PASSWORD }}   # encrypts the private data (vault.py)

      - name: Cache the Kronos model weights (only the first time they download)
        if: steps.weights.outputs.cache-hit != 'true' && hashFiles('.hf-cache/hub/models--NeoQuasar--Kronos-mini/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .hf-cache
          key: kronos-mini-${{ env.KRONOS_COMMIT }}

      - name: Save data back to the repo
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data state   # -A also records the old plain-text private files being removed
          if git ls-files site/data | grep -E '/(portfolio|trades|decisions|calls|consensus|rules|rules_trades|ict|ict_trades|lab|lab_trades|kronos_bot|kronos_trades)\.json$'; then
            echo "Refusing to commit private data in plain text"; exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update $(date -u +%FT%TZ)"
          git pull --rebase --autostash   # someone may have merged a change to main while this ran
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
