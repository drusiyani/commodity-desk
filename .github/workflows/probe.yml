name: Probe contract months
on:
  push:
    branches: [claude/commodity-trading-v2-z09y0m-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import time, yfinance as yf
          import rolls as R
          now = time.time()
          for sym in list(R.MARKETS)[:10]:
              cs, t = [], now
              for _ in range(4):
                  c = R.active(sym, t)
                  cs.append(c)
                  t = __import__("datetime").datetime.combine(R.roll_date(sym, *c), __import__("datetime").time(), __import__("datetime").timezone.utc).timestamp() + 86400
              out = []
              for c in cs:
                  t = R.ticker(sym, *c)
                  try:
                      df = yf.Ticker(t).history(period="1mo", interval="1d").dropna()
                      out.append(f"{t}: {len(df)} days from {df.index[0].date() if len(df) else '-'} last {df['Close'].iloc[-1] if len(df) else '-'}")
                  except Exception as e:
                      out.append(f"{t}: error {str(e)[:60]}")
              print(sym, " | ".join(out), flush=True)
          PY
