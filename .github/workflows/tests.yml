name: Tests

on:
  push:            # every push, on any branch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lab.txt
      - run: pip install -r requirements.txt -r requirements-lab.txt pytest
      - name: Run tests
        run: python -m pytest -q
